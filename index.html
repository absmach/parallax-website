<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parallax</title>
  <meta name="description" content="Parallax simulates how distributed systems behave—before changes hit production." />
  <meta property="og:title" content="Parallax" />
  <meta property="og:description" content="A world model for infrastructure." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090b0e;
      --surface: #111417;
      --border: #1d2126;
      --text: #e8e8e8;
      --muted: #4a4a4a;
      --accent: #5eead4;
      --accent-dim: #2d6a62;
      --risk: #ff8a65;
      --mono: 'JetBrains Mono', 'Courier New', monospace;
      --sans: 'Inter', system-ui, sans-serif;
    }

    html {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse 640px 520px at 50% 42%, rgba(9, 11, 14, 0.62) 0%, rgba(9, 11, 14, 0.28) 48%, rgba(9, 11, 14, 0) 72%);
    }

    .wrap {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 0 28px;
      position: relative;
      z-index: 2;
    }

    /* ── nav ── */
    nav {
      padding: 36px 0 0;
    }

    .wordmark {
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      display: block;
    }

    /* ── hero ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
    }

    .hero {
      padding: 80px 0 100px;
      width: 100%;
    }

    .hero-headline {
      font-size: clamp(36px, 7vw, 58px);
      font-weight: 300;
      line-height: 1.12;
      letter-spacing: -0.025em;
      color: var(--text);
      margin-bottom: 28px;
    }

    .hero-subline {
      font-size: 15px;
      font-weight: 400;
      color: var(--accent);
      letter-spacing: 0.01em;
      margin-bottom: 28px;
    }

    .hero-body {
      font-size: 15px;
      font-weight: 300;
      color: #787878;
      line-height: 1.7;
      margin-bottom: 0;
    }

    .hero-kicker {
      font-size: 15px;
      font-weight: 300;
      color: #787878;
      line-height: 1.7;
      margin-top: 20px;
      margin-bottom: 48px;
      font-style: italic;
    }

    /* ── form ── */
    .cta-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .cta-input {
      flex: 1;
      min-width: 200px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 11px 15px;
      font-family: var(--sans);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .cta-input::placeholder {
      color: var(--muted);
    }

    .cta-input:focus {
      border-color: var(--accent-dim);
      background: rgba(94, 234, 212, 0.03);
    }

    .cta-input:focus-visible {
      outline: 2px solid var(--accent-dim);
      outline-offset: 2px;
    }

    .cta-btn {
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      border-radius: 5px;
      padding: 11px 20px;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s, transform 0.15s;
    }

    .cta-btn:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .cta-btn:active {
      transform: translateY(0);
    }

    .cta-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .cta-note {
      font-size: 12px;
      color: var(--muted);
    }

    .cta-success {
      display: none;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    /* ── ticker ── */
    .ticker {
      margin-top: 22px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent-dim);
      letter-spacing: 0.02em;
      min-height: 16px;
    }

    .ticker::after {
      content: '';
      display: inline-block;
      width: 6px;
      height: 12px;
      margin-left: 2px;
      background: var(--accent-dim);
      vertical-align: -2px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* ── footer ── */
    footer {
      border-top: 1px solid var(--border);
      position: relative;
      z-index: 2;
      padding: 24px 0;
    }

    footer .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .footer-copy {
      font-size: 12px;
      color: var(--muted);
    }

    .footer-contact {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-contact:hover {
      color: var(--text);
    }

    @media (max-width: 480px) {
      .hero-headline {
        font-size: 34px;
      }

      footer .wrap {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker::after {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <nav>
    <div class="wrap">
      <a class="wordmark" href="/">Parallax</a>
    </div>
  </nav>

  <main>
    <section class="hero">
      <div class="wrap">
        <h1 class="hero-headline">
          The outage you<br />haven't had yet.
        </h1>
        <p class="hero-subline">A world model for infrastructure.</p>
        <p class="hero-body">Parallax simulates how distributed systems behave—before changes hit production.</p>
        <p class="hero-kicker">Prediction, not post-mortems.</p>
        <form class="cta-form" id="cta-form">
          <input class="cta-input" type="email" placeholder="you@yourco.com" required aria-label="Email address" />
          <button class="cta-btn" type="submit">Request access</button>
        </form>
        <p class="cta-note" id="cta-note">Private beta with selected infrastructure teams.</p>
        <p class="cta-success" id="cta-success">You're on the list.</p>
        <p class="ticker" id="ticker" aria-hidden="true"></p>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span class="footer-copy">© 2026 Parallax</span>
      <a class="footer-contact" href="mailto:hello@prlx.world">hello@prlx.world</a>
    </div>
  </footer>

  <script>
    document.getElementById('cta-form').addEventListener('submit', function (e) {
      e.preventDefault();
      this.style.display = 'none';
      document.getElementById('cta-note').style.display = 'none';
      document.getElementById('cta-success').style.display = 'block';
    });
  </script>

  <script>
    (function () {
      var canvas = document.getElementById('bg-canvas');
      var ctx = canvas.getContext('2d');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var W, H, DPR, nodes, edges, pulses, raf, lastRisk;

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        buildGraph();
      }

      function buildGraph() {
        nodes = [];
        var count = Math.max(16, Math.min(34, Math.floor((W * H) / 42000)));
        for (var i = 0; i < count; i++) {
          nodes.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: 1.5 + Math.random() * 1.3
          });
        }
        edges = [];
        var maxDist = Math.min(W, H) * 0.32;
        for (var a = 0; a < nodes.length; a++) {
          var candidates = [];
          for (var b = 0; b < nodes.length; b++) {
            if (a === b) continue;
            var dx = nodes[a].x - nodes[b].x, dy = nodes[a].y - nodes[b].y;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d < maxDist) candidates.push({ b: b, d: d });
          }
          candidates.sort(function (p, q) { return p.d - q.d; });
          candidates.slice(0, 2).forEach(function (c) {
            var key = a < c.b ? a + '-' + c.b : c.b + '-' + a;
            if (!edges.some(function (e) { return e.key === key; })) {
              edges.push({ key: key, a: a, b: c.b });
            }
          });
        }
        pulses = [];
      }

      function spawnPulse(risk) {
        if (!edges.length) return;
        var e = edges[Math.floor(Math.random() * edges.length)];
        pulses.push({ edge: e, t: 0, risk: risk, resolved: false, speed: risk ? 0.0032 + Math.random() * 0.0008 : 0.006 + Math.random() * 0.004 });
      }

      function frame(ts) {
        ctx.clearRect(0, 0, W, H);

        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(94, 234, 212, 0.07)';
        for (var i = 0; i < edges.length; i++) {
          var e = edges[i], p1 = nodes[e.a], p2 = nodes[e.b];
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }

        ctx.fillStyle = 'rgba(94, 234, 212, 0.22)';
        for (var n = 0; n < nodes.length; n++) {
          var node = nodes[n];
          ctx.beginPath();
          ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
          ctx.fill();
        }

        for (var k = pulses.length - 1; k >= 0; k--) {
          var pl = pulses[k];
          var pa = nodes[pl.edge.a], pb = nodes[pl.edge.b];
          if (pl.risk && !pl.resolved && pl.t > 0.7) pl.resolved = true;
          var color = pl.risk && !pl.resolved ? '255, 138, 101' : '94, 234, 212';
          var radius = pl.risk ? 6.5 : 3.5;
          var x = pa.x + (pb.x - pa.x) * pl.t;
          var y = pa.y + (pb.y - pa.y) * pl.t;
          var grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
          grad.addColorStop(0, 'rgba(' + color + ', 0.9)');
          grad.addColorStop(1, 'rgba(' + color + ', 0)');
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
          pl.t += pl.speed;
          if (pl.t >= 1) pulses.splice(k, 1);
        }

        if (!reduceMotion) {
          if (ts - lastRisk > 6500 + Math.random() * 3500) {
            spawnPulse(true);
            lastRisk = ts;
          }
          if (Math.random() < 0.045) spawnPulse(false);
          raf = requestAnimationFrame(frame);
        }
      }

      window.addEventListener('resize', resize);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (raf) cancelAnimationFrame(raf);
        } else if (!reduceMotion) {
          raf = requestAnimationFrame(frame);
        }
      });

      resize();
      if (reduceMotion) {
        spawnPulse(false);
        frame(0);
      } else {
        lastRisk = performance.now() - 4000;
        raf = requestAnimationFrame(frame);
      }
    })();
  </script>

  <script>
    (function () {
      var el = document.getElementById('ticker');
      if (!el) return;
      var messages = [
        'modeling cluster state',
        'trajectory diverging',
        'anomaly isolated',
        'future collapsed \u2014 stable',
        'rollback avoided'
      ];
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) {
        el.textContent = '> ' + messages[0];
        return;
      }
      var mi = 0, ci = 0, deleting = false;
      function tick() {
        var msg = messages[mi];
        if (!deleting) {
          ci++;
          el.textContent = '> ' + msg.slice(0, ci);
          if (ci === msg.length) {
            deleting = true;
            setTimeout(tick, 1500);
            return;
          }
          setTimeout(tick, 40);
        } else {
          ci--;
          el.textContent = '> ' + msg.slice(0, ci);
          if (ci === 0) {
            deleting = false;
            mi = (mi + 1) % messages.length;
            setTimeout(tick, 400);
            return;
          }
          setTimeout(tick, 18);
        }
      }
      tick();
    })();
  </script>

</body>

</html>
